name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the repo (checkout, build, test,
# license scan). Without this, each job's GITHUB_TOKEN gets the repo default,
# which can include write scopes a compromised action or dependency could abuse.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Explicit LTS + arch pins, not ubuntu-latest — a moving target that
        # silently changes underlying OS version. ubuntu-22.04 is the oldest
        # supported LTS (glibc 2.35): release bottles are built against its
        # glibc so they run on every newer release, and this pin keeps the
        # build honest on that floor. ubuntu-26.04 is GitHub's public-preview
        # image as of 2026-05; some software there can still be unstable, so
        # fail-fast stays false to avoid masking real failures on the other
        # runners if it flakes.
        os:
          [
            ubuntu-22.04,
            ubuntu-22.04-arm,
            ubuntu-24.04,
            ubuntu-24.04-arm,
            ubuntu-26.04,
            ubuntu-26.04-arm,
            macos-latest,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # winit + wgpu need windowing/GL dev headers to build on Linux.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all --all-features
      - name: Bench (compile gate)
        run: cargo bench --all --no-run

  licenses:
    name: license gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails the build if any dependency's license falls outside the permissive
      # allow-list in deny.toml — i.e. if anything copyleft/infectious (GPL/AGPL/…)
      # ever sneaks in via a dependency bump. Policy lives in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  linux-smoke:
    # The real-window gate. `check` above runs `cargo test`, which never opens
    # a window — it has therefore never exercised winit, wgpu surface creation,
    # or the runtime shared libraries the windowed app dlopens (a missing
    # libxkbcommon-x11-0 panicked at startup and CI stayed green). This job
    # launches the actual binary against a headless X11 and a headless Wayland
    # compositor and drives it through the control socket.
    name: linux real-window smoke (X11 + Wayland)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Release profile — separate cache from `check`'s debug artifacts.
          shared-key: linux-smoke
      - name: Install build + runtime deps and headless display servers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxcb1-dev libvulkan-dev \
            libfontconfig1-dev \
            mesa-vulkan-drivers fonts-dejavu-core \
            libxi6 libxcursor1 libxkbcommon-x11-0 libwayland-client0 \
            xvfb x11-utils weston
      - name: Build the real binary
        run: cargo build --release -p ember-app --bin ember-term
      # Both backends run even if the first fails, so one report covers both:
      # X11 and Wayland are separate winit backends and break independently.
      - name: Smoke — X11 (Xvfb)
        run: scripts/smoke/linux-window-smoke.sh x11 target/release/ember-term "$RUNNER_TEMP/smoke"
      - name: Smoke — Wayland (weston headless)
        # Runs even when X11 failed — the two winit backends break
        # independently, so one run should report on both.
        if: ${{ !cancelled() }}
        run: scripts/smoke/linux-window-smoke.sh wayland target/release/ember-term "$RUNNER_TEMP/smoke"
      - name: Upload smoke artifacts (logs, state, screenshots)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
