[workspace]
resolver = "2"
members = [
    "crates/ember-core",
    "crates/ember-session",
    "crates/ember-render",
    "crates/ember-platform",
    "crates/ember-app",
]

[workspace.package]
version = "0.6.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = [
    "Brandon W. King",
    "Claude Opus 4.8",
    "Claude Opus 5.0",
    "Claude Opus 5.5",
    "Claude Fable 5.0",
]

[workspace.dependencies]
ember-core = { path = "crates/ember-core" }
ember-session = { path = "crates/ember-session" }
ember-render = { path = "crates/ember-render" }
ember-platform = { path = "crates/ember-platform" }
# VT engine — pinned centrally for API-churn stability (design §2/§3).
# Not consumed yet; wired into ember-session in Epic B.
alacritty_terminal = "=0.26.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arboard = "3"
bitflags = { version = "2", features = ["serde"] }
portable-pty = "0.9"
libc = "0.2"
winit = "0.30"
wgpu = "29"
glyphon = "0.11"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# macOS: deliver Character Viewer (emoji picker) and Dictation text, and keep the
# key after a commit. The v0.30.x backport of rust-windowing/winit#4784; drop this
# once a winit release includes the fix.
[patch.crates-io]
winit = { git = "https://github.com/kingb/winit", rev = "f8d6ce3085399d0e5ab86fe173a64d914259e999" }
